s, when the phone has them.`,rotate:`Turns the whole screen, for a device mounted on its side or upside down. Preset button 4 also steps through it. At 90 and 270 the player is a tall column with a bar down each side, because the screen itself never changes shape.`,coverPanel:`Puts the track and the controls on a tinted panel of their own instead of straight over the blurred artwork. Cover style only.`,coverVolume:`The volume slider Cover draws under its transport. With it off the wheel still sets the volume, and the reading the other styles show over the middle of the screen comes back. Cover style only.`,vinylTint:`The colour the record is pressed in. Black is the ordinary one. Album presses it in the cover’s own colour, and Marble swirls the cover’s two colours through it. The grooves and the sheen stay as they are. Vinyl style only.`,flowBg:`What the covers stand on. Album colour washes the screen in a dark take on the cover’s own colours, changing with each track; Black is plain black. Cover flow style only.`,deckGlow:`The colour the car stereo’s display is lit in, the way a head unit lets you change its illumination. Album, the default, takes the colour from the cover, and so do the pixel notes floating over it. Rainbow turns the whole display slowly through every colour, and holds still with Animations off. Car stereo style only.`,tape:`Written is a blank label somebody filled in, with the colour band every tape wore. Printed is a pressed release: the cover is the label on a brushed metal shell, with a tape counter reading across the window and the track stamped on the metal below it. Clear is the tape itself, seen through its own shell, with the track across a label strip along the top and the cover behind the window between the spools. The key beside the transport cycles the three. Cassette style only.`,tapeArt:`Prints the album art on the right of the written cassette label, and behind the window between the spools on the clear one, where the tape path graduations sit when it is off. The printed design wears the cover as its label whatever this says. Cassette style only.`,words:`Whether the Lyrics style shows the words or just what is playing. The button on the left of the screen does the same thing.`,lyricsInfo:`Which corner the artwork and track sit in on the Lyrics style. Play and pause take the other end of the same edge, and previous and next sit at the sides.`,coverEdge:`Drops the padding around the album art so it runs to the edges with square corners. Cover style only.`,tip:`A one-off note offering to hide the on-screen buttons, since the presets do the same job. It appears a few seconds after a track starts and only while the buttons are showing.`,transport:`The previous, play and next buttons drawn on screen. The four preset buttons do the same job, so turning these off gives the artwork more room; a small legend takes their place showing which preset does what. Double-press the button under the wheel to show or hide them.`,seekDot:`The marker that rides the progress bar at the playhead: a dot on the line, a tick on the wave. Auto draws it everywhere except Cover, which reads cleaner without it. The bar still scrubs by dragging either way.`,seek:`Auto gives Classic and Poster the wave, and Vinyl and Cover a line. Pick one to use it everywhere.`,backdrop:`How strongly the blurred album art tints the screen behind the player. 0 turns it off. Poster does not use it.`,blur:`How far out of focus the artwork behind the screen is. Lower it to read the cover through the words, raise it for a wash of colour. 0 leaves it sharp.`,drift:`How far and how fast the blurred backdrop pans. 0 holds it still.`,clock:`Shows the time from your phone, in its own timezone.`,clockSize:`Scales the clock relative to its normal size.`,hdArt:`The device only receives 512px artwork. This looks the album up on Apple’s public search and uses the 1000px cover instead, which matters most in the Poster style. When the phone sends no artist
